name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile
        run: python -m py_compile skills/agent-workspace/scripts/aw.py skills/agent-workspace/scripts/aw_mcp.py
      - name: workspace tests
        run: python -m unittest discover -s skills/agent-workspace/tests -v
      - name: single tests
        run: python -m unittest discover -s skills/agent-workspace/tests/single -v
      - name: vendor paho import
        run: python -c "import sys; sys.path.insert(0, 'skills/agent-workspace/vendor'); import paho.mqtt.client as mqtt; print(mqtt.__file__)"
