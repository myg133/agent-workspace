name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: compile
        run: python -m py_compile skills/agent-workspace/scripts/aw.py skills/agent-workspace/scripts/aw_mcp.py
      - name: unit tests
        run: python -m unittest discover -s skills/agent-workspace/tests -v
