- insert:
    - id: aw-wake
      name: '@local/aw-wake'
      config:
        # 由 DSH 启动环境提供，不要写死（见 references/global/agent-plugins.md）
        repoRoot: !!js process.env.AW_REPO_ROOT
        agentId: !!js process.env.AW_AGENT_ID
        pollMs: 2000
        minIntervalMs: 10000
        wakeTypes:
          - question
          - blocker
          - handoff
          - decision
          - contract-change
        wakeExpect:
          - reply
          - ack
