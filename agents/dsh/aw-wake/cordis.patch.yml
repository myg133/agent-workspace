- insert:
    - id: aw-wake
      name: '@local/aw-wake'
      config:
        # 不写 repoRoot：插件从每个会话的 cwd 向上找 .aw/ 自动发现仓库，
        # 一台 DSH 可以同时服务多个 workspace（含 <repo>/code 这类子目录会话）。
        # 要限定范围时用 repoRoots: ['D:\proj\a', 'D:\proj\b']。
        # 不写 agentId = 多 agent 模式：监听 <repo>/.aw/wake/*.json，
        # 按每条消息自带的 agent 字段 + <repo>/.aw/sessions/<agent>.map.json 路由。
        pollMs: 2000
        minIntervalMs: 10000
        # 默认唤醒所有新消息（含 fyi）；wakeAll: false 时按下面两组规则过滤。
        wakeAll: true
        wakeTypes:
          - question
          - blocker
          - handoff
          - decision
          - contract-change
        wakeExpect:
          - reply
          - ack
