- insert:
    - id: aw-wake
      name: '@local/aw-wake'
      config:
        repoRoot: 'E:\Dev_tmp\agent-bus-test'
        agentId: tree
        pollMs: 2000
        minIntervalMs: 10000
        # 默认唤醒所有新消息（含 fyi）；与 omp 侧行为对齐，避免漏消息。
        # 想收紧就设 wakeAll: false，再用下面两组规则过滤。
        wakeAll: true
        wakeTypes:
          - question
          - blocker
          - handoff
          - decision
          - contract-change
        wakeExpect:
          - reply
          - ack
